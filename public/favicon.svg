<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Nestra">
  <!-- Nestra "N>" mark — token Neovim colorscheme palette.
       N: full height (16u, y=8→24).
       >: half height (8u, y=12→20), centered on N's vertical midline.
       Squared strokes (linecap=square, miterlimit=2) match the Full-ASCII
       aesthetic where every design-system radius is 0; miterlimit=2
       clips the acute N apex to a clean bevel and keeps the 90° chevron
       corner as a sharp miter. -->
  <style>
    .tile   { fill: #191918; }
    .border { stroke: #2f2f2d; }
    .n      { stroke: #e8e4dc; }
    .chev   { stroke: #d97757; }
    @media (prefers-color-scheme: light) {
      .tile   { fill: #f6f5f1; }
      .border { stroke: #e0dfd9; }
      .n      { stroke: #2a2920; }
      .chev   { stroke: #9a4929; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <rect class="border" x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke-width="1"/>
  <path class="n" d="M8 24 L8 8 L18 24 L18 8" fill="none" stroke-width="2.4"
        stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="2"/>
  <path class="chev" d="M21 12 L25 16 L21 20" fill="none" stroke-width="2.4"
        stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="2"/>
</svg>