<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Nestra — unified control center for AI Coding CLIs. Local-only desktop app: providers, sessions, skills, MCP servers, quota." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nestra</title>
    <style>
      /* Boot splash — self-contained (styles.css ships inside the JS bundle,
         so nothing styles the window until React mounts). Lives inside #root
         and is replaced by `createRoot(#root).render(<App/>)` on mount, so
         there is no JS cleanup. Colors mirror the design tokens verbatim
         (--bg-canvas / --fg / --accent) for a seamless handoff; design tokens
         and <html data-theme> aren't available yet, so we key off
         prefers-color-scheme (matches the default "system" theme pref). */
      .nestra-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #191918;
        color: #e8e4dc;
        z-index: 9999;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .nestra-boot__logo {
        width: 56px;
        height: 56px;
      }
      .nestra-boot__spin {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid rgba(217, 119, 87, 0.25);
        border-top-color: #d97757;
        animation: nestra-boot-spin 0.8s linear infinite;
      }
      @keyframes nestra-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: light) {
        .nestra-boot {
          background: #f6f5f1;
          color: #2f2e2c;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .nestra-boot__spin {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="nestra-boot" role="status" aria-label="Nestra">
        <img class="nestra-boot__logo" src="/favicon.svg" alt="" />
        <span class="nestra-boot__spin" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
